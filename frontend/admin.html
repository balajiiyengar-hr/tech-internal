<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Console - Tech Internal Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/assets/css/portal.css" rel="stylesheet">
</head>
<body>
  <div class="portal-shell d-flex">
    <aside class="portal-sidebar">
      <div class="sidebar-brand">
        <span class="brand-mark sm">TI</span>
        <span class="brand-text">Tech Internal</span>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section">Dashboard</div>
        <a href="/dashboard.html" class="nav-link"><i class="bi bi-grid-fill"></i> My Apps</a>
        <a href="/admin.html" class="nav-link active"><i class="bi bi-shield-lock"></i> Admin</a>
      </nav>
    </aside>

    <main class="portal-main flex-grow-1">
      <header class="portal-topbar d-flex align-items-center justify-content-between">
        <h1 class="h4 mb-0">Admin Console</h1>
        <div class="d-flex gap-2">
          <a href="/dashboard.html" class="btn btn-outline-secondary btn-sm">Back to Apps</a>
          <button type="button" class="btn btn-outline-danger btn-sm" id="logoutBtn">Sign Out</button>
        </div>
      </header>

      <section class="portal-content">
        <div id="adminAlert" class="alert d-none"></div>

        <div class="row g-4">
          <div class="col-lg-5">
            <div class="card shadow-sm border-0 h-100">
              <div class="card-header bg-white">
                <h2 class="h5 mb-0">Create Member</h2>
              </div>
              <div class="card-body">
                <form id="domainSettingsForm" class="mb-4 pb-3 border-bottom">
                  <h3 class="h6">Login methods</h3>
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="emailLoginEnabled">
                    <label class="form-check-label" for="emailLoginEnabled">Email / password</label>
                  </div>
                  <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="smsLoginEnabled">
                    <label class="form-check-label" for="smsLoginEnabled">Mobile / OTP</label>
                  </div>
                  <button type="submit" class="btn btn-outline-primary btn-sm">Save login methods</button>
                </form>
                <form id="registerUserForm">
                  <div class="mb-3">
                    <label class="form-label">Organization</label>
                    <input type="text" class="form-control" id="regDomain" readonly>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Display name</label>
                    <input type="text" class="form-control" id="regDisplayName" required>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Email (optional)</label>
                    <input type="email" class="form-control" id="regEmail">
                  </div>
                  <div class="mb-3" id="regPasswordGroup">
                    <label class="form-label">Password for email</label>
                    <input type="password" class="form-control" id="regPassword">
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Phone (optional)</label>
                    <input type="tel" class="form-control" id="regPhone">
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Role</label>
                    <select class="form-select" id="regRole" required></select>
                  </div>
                  <button type="submit" class="btn btn-primary">Create Member</button>
                </form>
                <form id="createRoleForm" class="mt-4 pt-3 border-top">
                  <h3 class="h6">Create custom role</h3>
                  <div class="mb-2">
                    <input type="text" class="form-control" id="roleName" placeholder="Role name" required>
                  </div>
                  <div class="mb-2">
                    <input type="text" class="form-control" id="roleKey" placeholder="role_key" required>
                  </div>
                  <div class="mb-3">
                    <input type="text" class="form-control" id="rolePermissions" placeholder="apps:read, members:read">
                    <div class="form-text">Comma-separated permission keys.</div>
                  </div>
                  <button type="submit" class="btn btn-outline-primary">Create Role</button>
                </form>
              </div>
            </div>
          </div>

          <div class="col-lg-7">
            <div class="card shadow-sm border-0 mb-4">
              <div class="card-header bg-white d-flex justify-content-between align-items-center">
                <h2 class="h5 mb-0">Organization Members</h2>
                <button class="btn btn-sm btn-outline-secondary" id="refreshUsersBtn">Refresh</button>
              </div>
              <div class="table-responsive">
                <table class="table table-hover mb-0">
                  <thead>
                    <tr>
                      <th>Member</th>
                      <th>Identities</th>
                      <th>Role</th>
                      <th>Status</th>
                      <th></th>
                    </tr>
                  </thead>
                  <tbody id="usersTableBody"></tbody>
                </table>
              </div>
              <div class="card-footer bg-white d-flex align-items-center justify-content-end gap-2">
                <button class="btn btn-sm btn-outline-secondary" id="usersPrevBtn" type="button">Previous</button>
                <span class="small text-muted" id="usersPageLabel">Page 1</span>
                <button class="btn btn-sm btn-outline-secondary" id="usersNextBtn" type="button">Next</button>
              </div>
            </div>

            <div class="card shadow-sm border-0">
              <div class="card-header bg-white">
                <h2 class="h5 mb-0">Add Portal Link</h2>
              </div>
              <div class="card-body">
                <form id="createAppForm" class="row g-3">
                  <div class="col-md-4">
                    <input type="text" class="form-control" id="appSection" placeholder="Section">
                  </div>
                  <div class="col-md-4">
                    <input type="text" class="form-control" id="appName" placeholder="App name" required>
                  </div>
                  <div class="col-md-4">
                    <input type="url" class="form-control" id="appUrl" placeholder="https://..." required>
                  </div>
                  <div class="col-12">
                    <button type="submit" class="btn btn-outline-primary">Add Link</button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="modal fade" id="resetPasswordModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="resetPasswordForm">
          <div class="modal-header">
            <h2 class="modal-title h5">Reset password</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <p class="text-muted small mb-3" id="resetPasswordUserLabel"></p>
            <div class="mb-3">
              <label class="form-label" for="resetPasswordInput">New password</label>
              <input type="password" class="form-control" id="resetPasswordInput" minlength="8" required>
            </div>
            <div class="mb-0">
              <label class="form-label" for="resetPasswordConfirm">Confirm password</label>
              <input type="password" class="form-control" id="resetPasswordConfirm" minlength="8" required>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save password</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/admin-v2.js"></script>
</body>
</html>
