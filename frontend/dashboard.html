<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Apps - Tech Internal Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/assets/css/portal.css" rel="stylesheet">
</head>
<body>
  <div class="portal-shell d-flex">
    <aside class="portal-sidebar">
      <div class="sidebar-brand">
        <span class="brand-mark sm">TI</span>
        <span class="brand-text">Tech Internal</span>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section">Dashboard</div>
        <a href="/dashboard.html" class="nav-link active"><i class="bi bi-grid-fill"></i> My Apps</a>
        <a href="#" class="nav-link sub"><i class="bi bi-box-arrow-up-right"></i> Applications</a>
        <a href="/admin.html" class="nav-link admin-only d-none" id="adminNavLink"><i class="bi bi-shield-lock"></i> Admin</a>
        <a href="#" class="nav-link"><i class="bi bi-bell"></i> Notifications</a>
      </nav>
      <div class="sidebar-footer">
        <small>Powered by Tech Internal</small>
      </div>
    </aside>

    <main class="portal-main flex-grow-1">
      <header class="portal-topbar d-flex align-items-center justify-content-between">
        <div class="search-wrap flex-grow-1 me-3">
          <i class="bi bi-search"></i>
          <input type="search" class="form-control" id="appSearch" placeholder="Search your apps">
        </div>
        <div class="dropdown">
          <button class="btn btn-light dropdown-toggle user-pill" data-bs-toggle="dropdown">
            <span id="userDisplayName">User</span>
            <small class="d-block text-muted" id="userDomain">techhr.com</small>
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="/admin.html" id="adminMenuLink" style="display:none">Admin Console</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><button class="dropdown-item text-danger" id="logoutBtn">Sign Out</button></li>
          </ul>
        </div>
      </header>

      <section class="portal-content">
        <div class="d-flex align-items-center justify-content-between mb-4">
          <div>
            <h1 class="h3 mb-1">My Apps</h1>
            <p class="text-muted mb-0" id="sectionTitle">Applications</p>
          </div>
          <div class="d-flex gap-2">
            <select class="form-select form-select-sm sort-select" id="sortApps">
              <option value="name">Sort: Name</option>
              <option value="section">Sort: Section</option>
            </select>
          </div>
        </div>

        <div id="appsContainer"></div>
        <nav class="d-flex align-items-center justify-content-end gap-2 mt-4" aria-label="Application pages">
          <button class="btn btn-sm btn-outline-secondary" id="appsPrevBtn" type="button">Previous</button>
          <span class="small text-muted" id="appsPageLabel">Page 1</span>
          <button class="btn btn-sm btn-outline-secondary" id="appsNextBtn" type="button">Next</button>
        </nav>
        <div id="emptyState" class="text-center text-muted py-5 d-none">
          <i class="bi bi-inbox display-4"></i>
          <p class="mt-3">No applications found.</p>
        </div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/dashboard.js"></script>
</body>
</html>
